# zizmor (https://docs.zizmor.sh/), the GitHub Actions audit, with its
# findings that are by design here. Everything else it reports is meant to
# be fixed, not listed.
rules:
  # It wants local actions as `$/.github/actions/...` instead of
  # `./.github/actions/...`. actionlint (ci.yml's lint job, tools/tools.txt's
  # pin) rejects that form ("ref is missing"), so the `./` form stays until
  # an actionlint release accepts the other one.
  self-repository:
    disable: true
