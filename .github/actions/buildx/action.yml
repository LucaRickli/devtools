# Docker Buildx for build/, which builds every image with docker buildx bake
# (build/docker-bake.hcl): the docker CLI's buildx plugin at the release
# pinned here, which setup-buildx-action fetches from buildx's GitHub
# release and this action then checks against that release's checksums.txt
# (setup-buildx-action checks nothing), as install.sh checks every tool;
# then, in a job that bakes, the BuildKit image build/build.sh pins, pulled
# with retries. build.sh makes its own builder of that image on its first
# bake (`packages`, docker-container), and buildx makes one of a local image
# without asking the registry again: Docker Hub, where BuildKit's images
# are, fails at times, and its anonymous pulls are limited per address,
# which GitHub's runners share. Every job that runs build/build.sh uses it,
# after actions/checkout; the plan job, which only reads the bake file,
# without the pull.
name: Set up Docker Buildx
description: buildx at the pinned release, checked; build/build.sh's BuildKit image pulled
inputs:
  buildkit:
    description: '"true" to pull the BuildKit image build/build.sh makes its builder of, for a job that bakes'
    default: "true"
runs:
  using: composite
  steps:
    # On docker's own builder, which needs no image: build.sh makes the one
    # it bakes on. Not from the Actions cache, which a pull request writes
    # too. Renovate's github-actions manager bumps the version with buildx's
    # releases (this action's `version`), as it bumps the action.
    - name: Install buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.2
        driver: docker
        cache-binary: false

    # The plugin docker runs, against the checksums.txt of the release it
    # says it is; then BuildKit, five tries 30 s apart.
    - name: Check buildx, pull BuildKit
      shell: bash
      env:
        BUILDKIT: ${{ inputs.buildkit }}
      run: |
        set -euo pipefail
        plugin=$(docker info --format json | jq -r '.ClientInfo.Plugins[] | select(.Name == "buildx") | .Path')
        version=$(docker info --format json | jq -r '.ClientInfo.Plugins[] | select(.Name == "buildx") | .Version')
        version=v${version#v}
        [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::buildx $version at $plugin is no release"; exit 1; }
        asset="buildx-${version}.linux-amd64"
        sums=$(curl -fsSL --retry 5 --retry-all-errors "https://github.com/docker/buildx/releases/download/${version}/checksums.txt")
        want=$(awk -v a="*${asset}" '$2 == a { print $1 }' <<<"$sums")
        got=$(sha256sum "$plugin" | cut -d' ' -f1)
        [[ $want =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256 for ${asset} in its release's checksums.txt"; exit 1; }
        [ "$got" = "$want" ] || { echo "::error::$plugin is not ${asset}: sha256 $got, the release's $want"; exit 1; }
        echo "buildx ${version} (${plugin}): sha256 ${got}, as its release has it"
        [ "$BUILDKIT" = true ] || exit 0
        image=$(sed -n 's/^buildkit=//p' build/build.sh)
        [[ $image =~ ^[a-z0-9./-]+:[^@]+@sha256:[0-9a-f]{64}$ ]] || { echo "::error::no BuildKit pin in build/build.sh"; exit 1; }
        for attempt in 1 2 3 4 5; do
          docker pull --quiet "$image" >/dev/null && break
          [ "$attempt" != 5 ] || { echo "::error::could not pull $image"; exit 1; }
          echo "pull of $image failed (attempt $attempt), retrying in 30s" >&2
          sleep 30
        done
        echo "pulled $image"
