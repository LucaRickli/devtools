# Put development tools from tools/tools.txt on the runner's PATH, the way
# the dev container and the VS Code Flatpak get them: the pinned release,
# checked against upstream's sha256 (tools/install.sh), so a job runs the
# same binary as everyone else and nothing a job downloads goes unchecked.
# For ci.yml's lint job (just, for `just check`, gh, actionlint and
# shellcheck): a setup-* action would fetch them with no checksum at all
# and hand them the job's token on top. The builds run build/'s scripts
# without just.
name: Install tools
description: tools/install.sh the named tools (tools/tools.txt pins) and add them to PATH
inputs:
  tools:
    description: names from tools/tools.txt, whitespace-separated
    required: true
runs:
  using: composite
  steps:
    - name: Install
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      # The GITHUB_PATH write is the one way onto the PATH of the steps that
      # follow, and what lands there was just checked against upstream's
      # sha256: hence the zizmor ignore.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        prefix="${RUNNER_TEMP}/tools"
        # shellcheck disable=SC2086  # one name per word
        tools/install.sh "$prefix" $TOOLS
        echo "${prefix}/bin" >> "$GITHUB_PATH"
