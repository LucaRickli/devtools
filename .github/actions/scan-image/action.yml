# Scan a locally built image right before it is pushed, so that an image
# carrying a secret, known-malicious code or a critical vulnerability is
# never published (scan.sh says what fails and why). Every job that pushes a
# container image runs it just before the push, and pull request builds run
# it too: they push nothing, but fail the same way (a pending Fedora update
# only warns there), so the PR is blocked instead of the push after merging.
# The VS Code Flatpak's images are its /app and nothing else, upstream's
# releases with no rpm database: their scan is the secret part alone
# (secrets-only). The image is in rootless podman's storage, where scan.sh
# runs it, or an OCI image layout that this action loads there first, as
# docker-bake.hcl writes a Flatpak's (output/images/NAME).
#
# What needs action also becomes code scanning alerts (Security tab), one
# category per image, so an alert closes when a later build of that image no
# longer has it. Not from pull requests: a fork's token cannot upload, and
# the gate above already reports there.
#
# trivy is the release tools/tools.txt pins (Renovate bumps it with the rest
# of the development tools), fetched and checked against upstream's sha256
# by tools/install.sh, so this action has no pin of its own for it.
# It is only ever run inside containers without secrets or tokens, the scan
# itself without network (scan.sh): a third-party binary that ran on the
# runner could read the job's secrets out of the runner's memory.
name: Scan an image before pushing it
description: Fail on secrets, known-malicious code and critical vulnerabilities in a local image
inputs:
  image:
    description: the local image to scan (rootless podman storage), or with layout the name it is loaded as
    required: true
  layout:
    description: an OCI image layout of one image (a directory) to load into rootless podman storage as image first
    default: ""
  name:
    description: >-
      What the image is published as (devcontainer): the code scanning
      category, one per image
    required: true
  upstream-paths:
    description: >-
      Path prefixes (no leading slash, whitespace-separated) holding pinned
      upstream releases, whose vulnerabilities are reported but never fail
      (scan.sh); known-malicious code fails there too
    default: ""
  secrets-only:
    description: >-
      "true" for an image that is a Flatpak's /app alone (the VS Code
      Flatpak's): trivy's secret scan only, no vulnerabilities, no Fedora
      updates
    default: "false"
  require:
    description: >-
      Fedora security updates the image must contain, as the `security`
      input of a rebuild started for them (ADVISORY SEVERITY PACKAGES, one
      per line or separated by ";"); empty for any other build
    default: ""
runs:
  using: composite
  steps:
    # By skopeo, which gives the image the name scan.sh is given as it
    # copies it (podman pull leaves a layout's image without one).
    - name: Load the image
      if: inputs.layout != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        LAYOUT: ${{ inputs.layout }}
      run: |
        set -euo pipefail
        skopeo copy --quiet "oci:${LAYOUT}" "containers-storage:${IMAGE}"
        podman image inspect --format '{{.Id}} {{.Size}}' "$IMAGE"

    # Fetched and checked only; scan.sh runs it in containers.
    - name: Get trivy
      id: trivy
      shell: bash
      run: |
        set -euo pipefail
        bin="${RUNNER_TEMP}/scan-image"
        tools/install.sh "$bin" trivy
        echo "path=$bin/bin/trivy" >> "$GITHUB_OUTPUT"

    # Fails only when the scan itself could not finish. A verdict of "fail"
    # is acted on at the end, after the upload, so the alerts show what
    # stopped the push.
    - name: Scan
      id: scan
      shell: bash
      env:
        TRIVY: ${{ steps.trivy.outputs.path }}
        IMAGE: ${{ inputs.image }}
        NAME: ${{ inputs.name }}
        UPSTREAM: ${{ inputs.upstream-paths }}
        REQUIRE: ${{ inputs.require }}
        SECRETS_ONLY: ${{ inputs.secrets-only == 'true' && '1' || '' }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/scan-image-${NAME}"
        rm -f "$out.sarif" "$out.result"
        SARIF="$out.sarif" RESULT="$out.result" "${GITHUB_ACTION_PATH}/scan.sh" "$IMAGE" || true
        result=$(cat "$out.result" 2>/dev/null || true)
        case "$result" in
          pass|fail) ;;
          *) echo "::error::the scan of $IMAGE did not complete"; exit 1 ;;
        esac
        echo "result=$result" >> "$GITHUB_OUTPUT"
        echo "sarif=$out.sarif" >> "$GITHUB_OUTPUT"

    # Reporting must never be what fails a build, hence continue-on-error; a
    # failed upload leaves the alerts at the previous build's state.
    - name: Upload to code scanning
      if: github.event_name != 'pull_request'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: image:${{ inputs.name }}

    - name: Verdict
      if: steps.scan.outputs.result == 'fail'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        echo "::error::$IMAGE must not be pushed; the step summary has what the scan found"
        exit 1
