# trivy's secret scanner, on top of its built-in rules (scan.sh).

# Its built-in allow rules skip /usr/lib, /usr/share and /usr/include. In an
# image every machine pulls, /usr is exactly what they all share, so a key a
# build step leaves there is the case to catch.
disable-allow-rules:
  - usr-dirs

allow-rules:
  # Go's standard library sources carry public test keys
  # (crypto/x509/platform_root_key.pem, crypto/tls/testdata/example-key.pem),
  # here in the VS Code Flatpak's image, at /app/go/src (scan.sh scans the
  # image's root, so the paths start at app/), and nowhere else.
  - id: devtools-go-sources
    description: Go standard library sources in the VS Code Flatpak
    path: ^/?app/go/src/
